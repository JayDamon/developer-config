################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
# kanshi (exec-once below) handles per-profile monitor layout automatically.
# These lines are fallbacks — Hyprland ignores rules for disconnected outputs.
monitor = DP-2, 5120x1440@59.98, 0x0, 1              # desktop: ultrawide
monitor = DP-3, 2560x1440@59.95, 5120x0, 1, transform, 3  # desktop: vertical
monitor = eDP-1, preferred, 0x0, 1.5                  # laptop built-in
monitor = , preferred, auto, 1                         # catch-all for any other
