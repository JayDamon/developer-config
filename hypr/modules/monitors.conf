################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
# kanshi (exec-once below) handles per-profile monitor layout automatically.
# These lines are fallbacks — Hyprland ignores rules for disconnected outputs.
# Use desc: matching so these work regardless of which port a monitor is plugged into.
monitor = desc:Samsung Electric Company C49RG9x H1AK500000, 5120x1440@59.98, 0x0, 1
monitor = desc:Dell Inc. DELL U2715H 0x30505353, 2560x1440@59.95, 5120x0, 1, transform, 3
monitor = eDP-1, preferred, 0x0, 2.0                  # laptop built-in (3840x2400 → 1920x1200 logical)
monitor = , preferred, auto, 1                         # catch-all for any other
