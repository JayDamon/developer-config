#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox
# exec-once = bash -c "waybar"
exec-once = bash -c "sleep 1 && waybar"
# exec-once = sleep 1 && waybar
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"
exec-once = /usr/lib/pam_kwallet_init

# Monitor layout management — kanshi detects which monitors are connected and
# activates the matching profile from ~/.config/kanshi/config.
exec-once = kanshi

# Workspace routing — sets which workspaces live on which monitor.
# Also called by kanshi on profile switch (via exec in kanshi.conf).
exec = ~/.config/hypr/scripts/workspaces.sh

# Kill all RGB on login
exec-once = sleep 3 && ~/.config/hypr/scripts/kill-rgb.sh

# exec-once = sleep 1 && hyprctl dispatch moveworkspacetomonitor 1 DP-2
