# kanshi — Wayland output manager. Profiles activate automatically on monitor connect/disconnect.
# Docs: https://sr.ht/~emersion/kanshi/
#
# Connector names are used here (DP-2, DP-6, eDP-1) because the exact wlroots output
# description format kanshi needs for EDID matching differs from hyprctl's output —
# and wlr-randr (the tool to verify it) is not installed.
# If monitors move ports, update the connector names here.
#
# Current ports: DP-6 = Samsung ultrawide, DP-2 = Dell U2715H, eDP-1 = laptop

# ── Desktop: ultrawide + Dell vertical + laptop ───────────────────────────────
# Most specific profile listed first — kanshi picks the first match.
# Laptop centered below the ultrawide; (5120-1920)/2 = 1600 → centered x offset.
profile desktop-all {
    output DP-6 mode 5120x1440@59.980 position 0,0 scale 1.0
    output DP-2 mode 2560x1440@59.950 position 5120,0 transform 270 scale 1.0
    output eDP-1 mode preferred position -1920,0 scale 2.0
    exec ~/.config/hypr/scripts/workspaces.sh
}

# ── Desktop: ultrawide + Dell vertical (no laptop) ────────────────────────────
profile desktop {
    output DP-6 mode 5120x1440@59.980 position 0,0 scale 1.0
    output DP-2 mode 2560x1440@59.950 position 5120,0 transform 270 scale 1.0
    exec ~/.config/hypr/scripts/workspaces.sh
}

# ── Laptop only ────────────────────────────────────────────────────────────────
# Sharp 3840x2400 built-in. Scale 2.0 → effective 1920x1200 logical resolution.
profile laptop {
    output eDP-1 mode preferred position 0,0 scale 2.0
    exec ~/.config/hypr/scripts/workspaces.sh
}

# ── Laptop + Dell vertical ─────────────────────────────────────────────────────
# Dell to the right of the laptop (1920 logical px wide at scale 2.0).
# Dell at transform 270 is 1440 wide × 2560 tall in logical space.
profile laptop-dell {
    output eDP-1 mode preferred position 0,0 scale 2.0
    output DP-2 mode 2560x1440@59.950 position 1920,0 transform 270 scale 1.0
    exec ~/.config/hypr/scripts/workspaces.sh
}

# ── Laptop + Samsung ultrawide ────────────────────────────────────────────────
# Ultrawide sits on top; laptop screen centered below it.
profile laptop-ultrawide {
    output DP-6 mode 5120x1440@59.980 position 0,0 scale 1.0
    output eDP-1 mode preferred position -1920,0 scale 2.0
    exec ~/.config/hypr/scripts/workspaces.sh
}
