# kanshi — Wayland output manager. Profiles activate automatically on monitor connect/disconnect.
# Docs: https://sr.ht/~emersion/kanshi/
#
# To find your monitor names (for EDID-based matching):
#   hyprctl monitors -j | jq '.[] | {name, make, model}'
# You can use either connector names (DP-2) or quoted "Make Model" strings from EDID.
# EDID-based matching is more robust — works regardless of which port you plug into.

# ── Desktop: ultrawide + vertical ────────────────────────────────────────────
# Two specific connectors on the desktop PC — connector names are stable here.
profile desktop {
    output DP-2 mode 5120x1440@59.980 position 0,0 scale 1.0
    output DP-3 mode 2560x1440@59.950 position 5120,0 transform 270 scale 1.0
    exec ~/.config/hypr/scripts/workspaces.sh
}

# ── Laptop only ───────────────────────────────────────────────────────────────
# eDP-1 is the standard connector name for a built-in laptop display.
# Adjust scale for your screen's DPI (1.5 is typical for ~1920x1200 14" screens).
profile laptop {
    output eDP-1 mode preferred position 0,0 scale 1.5
    exec ~/.config/hypr/scripts/workspaces.sh
}

# ── Laptop + external monitor ─────────────────────────────────────────────────
# The wildcard (*) matches whatever external monitor is plugged in.
# Adjust scale values and positions to match your physical setup.
# Workspaces 1-7 go to the external monitor, 8-10 stay on the laptop screen.
profile laptop-ultrawide {
    output eDP-1 mode preferred position 0,0 scale 1.5
    output * mode preferred position auto scale 1.0
    exec ~/.config/hypr/scripts/workspaces.sh
}
