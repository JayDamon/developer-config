general {
    no_fade_in = false
    grace = 0
}

background {
    path = screenshot # Blurs current desktop
    blur_passes = 2 
}

input-field {
    size = 200, 50
    dots_center = true
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    position = 0, -20
    halign = center
    valign = center
}

label {
    text = $TIME # Displays current time
    font_size = 64
    position = 0, 80
    halign = center
    valign = center
}

