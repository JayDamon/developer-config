## PREFIX_PLACEHOLDER ##

set -g base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g escape-time 0
set -g history-limit 1000000
set -g mode-keys vi
set -s escape-time 0

# True color support — required for tokyonight to render correctly
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Undercurl support (for LSP diagnostics in neovim)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Focus events — lets neovim detect when you switch panes
set -g focus-events on

# Pane navigation (prefix + key)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Splits (prefix + key, v/s mirrors Ctrl-w v/s in neovim)
bind \\ split-window -h -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind S choose-tree -s

# Switch windows
bind n next-window
bind p previous-window

# Resize panes (repeatable, hold after prefix)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vi-style copy mode
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Escape send -X cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Incremental search in copy mode (highlights as you type)
bind-key -T copy-mode-vi / command-prompt -i -p "(search down)" "send -X search-forward-incremental \"%%%\""
bind-key -T copy-mode-vi ? command-prompt -i -p "(search up)" "send -X search-backward-incremental \"%%%\""

# Quick reload
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Toggle side pane (hide/restore like an IDE sidebar)
bind g run-shell "~/.config/tmux/toggle-pane.sh"

# Lazydocker
unbind D
bind D new-window -n "docker" "lazydocker"
bind W choose-client

set-option -g mouse on
set -g allow-passthrough

# ── Tokyonight Night Status Bar ──────────────────────────────────
# Palette:
#   bg:       #1a1b26    bg_dark:  #16161e    bg_hl:    #292e42
#   fg:       #c0caf5    fg_dark:  #a9b1d6    comment:  #565f89
#   blue:     #7aa2f7    green:    #9ece6a    magenta:  #bb9af7
#   cyan:     #7dcfff    yellow:   #e0af68    red:      #f7768e

set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#16161e,fg=#a9b1d6"

# Left: session name
set -g status-left "#[bg=#7aa2f7,fg=#16161e,bold] #S #[bg=#16161e,fg=#7aa2f7] "
set -g status-left-length 30

# Right: date and time
set -g status-right "#[fg=#565f89]%a %b %d #[fg=#a9b1d6]%H:%M "
set -g status-right-length 40

# Window tabs
set -g window-status-format "#[fg=#565f89] #I:#W "
set -g window-status-current-format "#[bg=#292e42,fg=#7aa2f7,bold] #I:#W "
set -g window-status-separator ""

# Pane borders — heavy lines so the active pane visually pops
set -g pane-border-lines heavy
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[bg=#292e42 fg=#7aa2f7 bold],#[bg=#292e42 fg=#a9b1d6]} #{pane_index}: #{pane_title} "
bind T command-prompt -p "Pane title:" 'select-pane -T "%%"'
bind N command-prompt -p "Window name:" 'rename-window "%%"'

# Command / message bar
set -g message-style "bg=#292e42,fg=#c0caf5"
set -g message-command-style "bg=#292e42,fg=#c0caf5"

# Copy mode highlight
set -g mode-style "bg=#292e42,fg=#c0caf5"

# --- TPM (Tmux Plugin Manager) ---
# Install: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Then prefix + I to install plugins
set -g @plugin 'tmux-plugins/tpm'

## LINUX_PLUGINS_PLACEHOLDER ##

run -b '~/.tmux/plugins/tpm/tpm'
